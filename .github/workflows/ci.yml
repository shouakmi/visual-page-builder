name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run's answer irrelevant. Cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the floor declared in engines. Nothing may merge that breaks it.
        node: [24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile makes CI fail rather than silently resolve a different
      # dependency graph than the one a human reviewed.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Proves the built artifact is real and non-empty, not just that vite
      # exited 0.
      - name: Verify build output
        run: |
          test -f apps/web/dist/index.html
          test -d apps/web/dist/assets
          echo "dist size: $(du -sh apps/web/dist | cut -f1)"
